# ==============================================================================
# SpeedRacing / LightPress - Cloudflare Tunnel local + PHP 8.4-FPM
# Dominio publico: https://www.speedracing.com.br
# Origin do Tunnel: http://localhost:80
# ==============================================================================
# Substitua o arquivo atual do SITE por este conteudo; nao acrescente ao anterior.
# Este arquivo deve ser incluido no contexto http {}, como sites-enabled/*.conf.
#
# Dependencias preservadas da instalacao informada:
# - zona FastCGI WORDPRESS ja definida globalmente por fastcgi_cache_path;
# - layout dessa zona: levels=1:2;
# - diretorio dessa zona igual a cache.cache_path do config.local.php;
# - usuario PHP-FPM com permissao de remover arquivos nesse cache;
# - PHP-FPM: /run/php/php8.4-fpm.sock;
# - arquivo fastcgi_params padrao da instalacao Nginx.
# Nao declare novamente a zona WORDPRESS neste arquivo.
#
# No LightPress: app.canonical_origin = https://www.speedracing.com.br.
# No Tunnel: preserve o Host solicitado; remova a rota de testes suatechlab.
# Mantenha HTTPS para o visitante na Cloudflare. O origin continua em HTTP local.
# MULTIPLOS SITES: use a mesma escuta compartilhada dos demais vhosts (:80).
# Nao crie listen 127.0.0.1:80 ou [::1]:80 exclusivo deste site: esses enderecos
# especificos podem excluir da selecao local outros vhosts com listen 80/[::]:80.
# Restrinja acesso externo a porta do origin no firewall, considerando todos os
# sites hospedados. A confianca nos cabecalhos continua limitada ao Tunnel local.
# Valide no servidor: sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

# HEAD utiliza a mesma entrada de cache de GET.
map $request_method $sr_cache_method {
    default $request_method;
    HEAD GET;
}

# Usa a URI ORIGINAL, sem query string, mesmo apos o redirect interno a index.php.
map $request_uri $sr_request_path {
    ~^(?<sr_original_path>[^?]+) $sr_original_path;
    default $request_uri;
}

map $request_method $sr_skip_method {
    default 1;
    GET 0;
    HEAD 0;
}

# Toda query funcional/desconhecida ignora cache; apenas rastreamento e dispensavel.
map $args $sr_skip_query {
    default 1;
    "" 0;
    ~*^((utm_[a-z0-9_]+|fbclid|gclid|msclkid)=[^&]*&?)+$ 0;
}

map $http_cookie $sr_skip_session {
    default 0;
    ~*LIGHTPRESSSESSID 1;
}

map $http_authorization $sr_skip_authorization {
    default 1;
    "" 0;
}

# Somente o front controller publico pode utilizar cache de respostas PHP.
# Isso tambem protege arquivos administrativos acessados por caminhos codificados.
map $fastcgi_script_name $sr_skip_script {
    default 1;
    /index.php 0;
}

map $sr_request_path $sr_skip_path {
    default 0;
    ~*^/(admin|api|preview)(/|$) 1;
    # Caminhos alternativos nao devem criar copias fora da purga canonica.
    ~% 1;
    ~// 1;
}

# Nomes especificos deste site, para nao duplicar zonas lp_* de outros arquivos.
limit_req_zone $binary_remote_addr zone=speedracing_views:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=speedracing_login:5m rate=10r/m;

# Backend PHP-FPM dedicado deste vhost com virada/rollback instantaneo em 1 linha.
# Mantenha php8.4-fpm em standby por 48h apos migrar para php8.5-fpm.
upstream speedracing_php {
    server unix:/run/php/php8.4-fpm.sock;
    # server unix:/run/php/php8.5-fpm.sock;
}

# Dominio sem www: somente redirecionamento, sem servir ou cachear conteudo.
# A rota desse hostname deve chegar a este origin, ou o redirect deve ser feito
# diretamente na Cloudflare.
server {
    listen 80;
    listen [::]:80;
    server_name speedracing.com.br;

    # Se este bloco for o padrao da porta, nao redirecionar outros dominios.
    if ($host != "speedracing.com.br") {
        return 444;
    }

    access_log off;
    return 301 https://www.speedracing.com.br$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.speedracing.com.br;

    root /mnt/hdd/sites/speedracing-lightpress/public;
    index index.php index.html index.htm;
    server_tokens off;

    # O cloudflared roda neste servidor. Nao confiar em redes externas.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    # Impede servir o site de testes ou hosts desconhecidos como vhost padrao.
    if ($host != "www.speedracing.com.br") {
        return 444;
    }

    # X-Forwarded-Proto descreve o acesso do visitante a Cloudflare.
    # NUNCA usar $scheme para este redirect: a conexao local do Tunnel e HTTP.
    if ($http_x_forwarded_proto != "https") {
        return 301 https://www.speedracing.com.br$request_uri;
    }

    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Preserva o limite Nginx informado. PHP e LightPress validam o upload final.
    client_max_body_size 64M;

    access_log off;
    error_log /var/log/nginx/speedracing_error.log warn;
    limit_req_status 429;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Served-By "Ultra LightPress" always;
    add_header X-FastCGI-Cache $upstream_cache_status always;

    # A CSP publica permanece sob controle do LightPress. Nao impor uma CSP que
    # bloqueie os scripts inline existentes no painel administrativo.

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Uploads novos: somente arquivos estaticos; nunca executar interpretadores.
    location ^~ /uploads/ {
        # O prefixo ^~ exige repetir aqui a protecao a arquivos ocultos.
        location ~ /\. {
            return 404;
        }
        location ~* \.(php[0-9]*|phtml|phar|pl|py|cgi|sh)(/|$) {
            return 404;
        }

        try_files $uri =404;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Uploads legados do WordPress: mesma URL e mesmo diretorio fisico anterior.
    # root evita ambiguidades entre alias e try_files.
    location ^~ /wp-content/uploads/ {
        root /mnt/hdd/sites/speedracing;

        location ~ /\. {
            return 404;
        }
        location ~* \.(php[0-9]*|phtml|phar|pl|py|cgi|sh)(/|$) {
            return 404;
        }

        try_files $uri =404;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Categorias antigas: preserva o redirect para a pagina de categoria.
    # As duas regras ficam no mesmo prefixo para respeitar a precedencia de ^~.
    location ^~ /category/ {
        rewrite ^/category/(.+)/feed/?$ https://www.speedracing.com.br/categoria/$1/ permanent;
        rewrite ^/category/(.*)$ https://www.speedracing.com.br/categoria/$1 permanent;
    }

    # Remove feeds legados de artigos, preservando os feeds nativos de categorias.
    # /feed/, /feed.xml e /categoria/{slug}/feed[.xml] continuam no LightPress.
    location ~ ^/(?!categoria/)(.+)/feed/?$ {
        return 301 https://www.speedracing.com.br/$1/;
    }

    location = /favicon.ico {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        try_files $uri =404;
        log_not_found off;
        access_log off;
    }

    # O contador deve passar pela rota protegida com limit_req.
    location = /api/view.php {
        return 404;
    }

    location ^~ /api/view/ {
        limit_req zone=speedracing_views burst=10 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # Login separado: sempre dinamico e com limite por IP real do visitante.
    location = /admin/login.php {
        limit_req zone=speedracing_login burst=5 nodelay;
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass speedracing_php;
        fastcgi_cache off;
        fastcgi_intercept_errors off;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|webp|avif|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;

        # Um unico include de parametros, sem duplicar fastcgi-php.conf.
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass speedracing_php;
        fastcgi_intercept_errors off;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;

        # Preserva a zona ja utilizada pela instalacao.
        # $scheme e http no origin; o CacheManager purga http e https.
        fastcgi_cache WORDPRESS;
        fastcgi_cache_key "$scheme$sr_cache_method$host$sr_request_path";
        fastcgi_cache_methods GET HEAD;
        fastcgi_cache_valid 200 301 302 60m;
        fastcgi_cache_min_uses 1;

        fastcgi_cache_lock on;
        fastcgi_cache_lock_timeout 5s;
        fastcgi_cache_use_stale error timeout updating invalid_header http_500 http_503;
        fastcgi_cache_background_update on;

        # Respeitar Cache-Control, Expires, Set-Cookie e X-Accel-Expires do PHP.
        # Nao adicionar fastcgi_ignore_headers para esses campos.
        fastcgi_cache_bypass
            $sr_skip_method
            $sr_skip_query
            $sr_skip_session
            $sr_skip_authorization
            $sr_skip_script
            $sr_skip_path;

        fastcgi_no_cache
            $sr_skip_method
            $sr_skip_query
            $sr_skip_session
            $sr_skip_authorization
            $sr_skip_script
            $sr_skip_path
            $upstream_http_set_cookie;
    }
}
