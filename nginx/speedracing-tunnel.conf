# ==============================================================================
# SpeedRacing / LightPress - Cloudflare Tunnel local + PHP 8.5-FPM
# Dominio publico: https://www.speedracing.com.br
# Origin do Tunnel: http://localhost:80
# ==============================================================================
#
# Dependencias preservadas da instalacao informada:
# - zona FastCGI WORDPRESS definida globalmente no nginx.conf (com levels=1:2 e inactive=10d);
# - diretorio dessa zona igual a cache.cache_path do config.local.php;
# - usuario PHP-FPM com permissao de remover arquivos nesse cache;
# - PHP-FPM: /run/php/php8.5-fpm.sock (rollback 8.4 em 1 linha no upstream);
# - arquivo fastcgi_params padrao da instalacao Nginx.
#
# Valide no servidor: sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

# HEAD utiliza a mesma entrada de cache de GET.
map $request_method $sr_cache_method {
    default $request_method;
    HEAD GET;
}

# Usa a URI ORIGINAL, sem query string, mesmo apos o redirect interno a index.php.
map $request_uri $sr_request_path {
    ~^(?<sr_original_path>[^?]+) $sr_original_path;
    default $request_uri;
}

map $request_method $sr_skip_method {
    default 1;
    GET 0;
    HEAD 0;
}

# Toda query funcional/desconhecida ignora cache; apenas rastreamento e dispensavel.
map $args $sr_skip_query {
    default 1;
    "" 0;
    ~*^((utm_[a-z0-9_]+|fbclid|gclid|msclkid)=[^&]*&?)+$ 0;
}

map $http_cookie $sr_skip_session {
    default 0;
    ~*LIGHTPRESSSESSID 1;
}

map $http_authorization $sr_skip_authorization {
    default 1;
    "" 0;
}

# Somente o front controller publico pode utilizar cache de respostas PHP.
# Isso tambem protege arquivos administrativos acessados por caminhos codificados.
map $fastcgi_script_name $sr_skip_script {
    default 1;
    /index.php 0;
}

map $sr_request_path $sr_skip_path {
    default 0;
    ~*^/(admin|api|preview)(/|$) 1;
    # Caminhos alternativos nao devem criar copias fora da purga canonica.
    ~% 1;
    ~// 1;
}

# Nomes especificos deste site, para nao duplicar zonas lp_* de outros arquivos.
limit_req_zone $binary_remote_addr zone=speedracing_views:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=speedracing_login:5m rate=10r/m;
limit_req_zone $binary_remote_addr zone=speedracing_api:10m rate=60r/m;

# Backend PHP-FPM centralizado para virada/rollback instantaneo em 1 linha.
upstream speedracing_php {
    server unix:/run/php/php8.5-fpm.sock;
    # server unix:/run/php/php8.4-fpm.sock;
}

# Dominio sem www: somente redirecionamento, sem servir ou cachear conteudo.
server {
    listen 80;
    listen [::]:80;
    server_name speedracing.com.br;

    if ($host != "speedracing.com.br") {
        return 444;
    }

    access_log off;
    return 301 https://www.speedracing.com.br$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.speedracing.com.br;

    root /mnt/hdd/sites/speedracing-lightpress/public;
    index index.php index.html index.htm;
    server_tokens off;

    # Evita que redirects internos de diretorio gerem Location: http://... atras do Tunnel.
    absolute_redirect off;

    # O cloudflared roda neste servidor. Nao confiar em redes externas.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    # Impede servir o site de testes ou hosts desconhecidos como vhost padrao.
    if ($host != "www.speedracing.com.br") {
        return 444;
    }

    # X-Forwarded-Proto descreve o acesso do visitante a Cloudflare.
    # NUNCA usar $scheme para este redirect: a conexao local do Tunnel e HTTP.
    if ($http_x_forwarded_proto != "https") {
        return 301 https://www.speedracing.com.br$request_uri;
    }

    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Alinhado ao limite de upload de 8 MiB + overhead multipart (Passo 7).
    client_max_body_size 12M;

    access_log off;
    error_log /var/log/nginx/speedracing_error.log warn;
    limit_req_status 429;

    # Oculta a copia vinda do PHP-FPM para que o add_header do Nginx emita cada cabecalho apenas 1 vez
    fastcgi_hide_header X-Content-Type-Options;
    fastcgi_hide_header X-Frame-Options;
    fastcgi_hide_header Referrer-Policy;
    fastcgi_hide_header Permissions-Policy;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Served-By "Ultra LightPress" always;
    add_header X-FastCGI-Cache $upstream_cache_status always;

    # A CSP publica permanece sob controle do LightPress (public/index.php).
    # O painel /admin/ recebe CSP propria em seu bloco location dedicado abaixo.

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Uploads novos: somente arquivos estaticos; nunca executar interpretadores ou scripts em SVG.
    location ^~ /uploads/ {
        location ~ /\. {
            return 404;
        }
        location ~* \.(php[0-9]*|phtml|phar|pl|py|cgi|sh)(/|$) {
            return 404;
        }

        try_files $uri =404;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox;" always;
        add_header X-Served-By "Ultra LightPress" always;
    }

    # Uploads legados do WordPress: mesma URL e mesmo diretorio fisico anterior.
    location ^~ /wp-content/uploads/ {
        root /mnt/hdd/sites/speedracing;

        location ~ /\. {
            return 404;
        }
        location ~* \.(php[0-9]*|phtml|phar|pl|py|cgi|sh)(/|$) {
            return 404;
        }

        try_files $uri =404;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox;" always;
        add_header X-Served-By "Ultra LightPress" always;
    }

    # Categorias antigas: preserva o redirect para a pagina de categoria.
    location ^~ /category/ {
        rewrite ^/category/(.+)/feed/?$ https://www.speedracing.com.br/categoria/$1/ permanent;
        rewrite ^/category/(.*)$ https://www.speedracing.com.br/categoria/$1 permanent;
    }

    # Remove feeds legados de artigos, preservando os feeds nativos de categorias.
    location ~ ^/(?!categoria/)(.+)/feed/?$ {
        return 301 https://www.speedracing.com.br/$1/;
    }

    location = /favicon.ico {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Served-By "Ultra LightPress" always;
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        try_files $uri =404;
        log_not_found off;
        access_log off;
    }

    # O contador deve passar pela rota protegida com limit_req.
    location = /api/view.php {
        return 404;
    }

    location ^~ /api/view/ {
        limit_req zone=speedracing_views burst=10 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # APIs públicas com rate limiting defensivo (AUD-SEC-03)
    location ^~ /api/ {
        limit_req zone=speedracing_api burst=20 nodelay;

        try_files $uri =404;

        location ~ \.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS on;
            fastcgi_param HTTP_X_REAL_IP $remote_addr;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_pass speedracing_php;
            fastcgi_intercept_errors off;
        }
    }

    # Atalho direto para /admin (sem barra final) evitando redirect de diretorio.
    location = /admin {
        return 302 /admin/login.php;
    }

    # Login separado: sempre dinamico, sem cache e com limite por IP real do visitante.
    location = /admin/login.php {
        limit_req zone=speedracing_login burst=5 nodelay;
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass speedracing_php;
        fastcgi_cache off;
        fastcgi_intercept_errors off;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Served-By "Ultra LightPress" always;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com; frame-ancestors 'self';" always;
    }

    # Ativacao de conta separada: protegida contra forca bruta e sem cache.
    location = /admin/activate.php {
        limit_req zone=speedracing_login burst=5 nodelay;
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass speedracing_php;
        fastcgi_cache off;
        fastcgi_intercept_errors off;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Served-By "Ultra LightPress" always;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com; frame-ancestors 'self';" always;
    }

    # Painel administrativo: executa PHP via location aninhado e aplica CSP dedicada ao /admin/.
    location ^~ /admin/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Served-By "Ultra LightPress" always;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com; frame-ancestors 'self';" always;

        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            try_files $uri =404;

            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS on;
            fastcgi_param HTTP_X_REAL_IP $remote_addr;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_pass speedracing_php;
            fastcgi_cache off;
            fastcgi_intercept_errors off;
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 16k;

            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Served-By "Ultra LightPress" always;
            add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com; frame-ancestors 'self';" always;
        }
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|webp|avif|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Served-By "Ultra LightPress" always;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass speedracing_php;
        fastcgi_intercept_errors off;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;

        # Zona global WORDPRESS (verificar inactive=10d em /etc/nginx/nginx.conf).
        # $scheme e http no origin; o CacheManager purga http e https.
        fastcgi_cache WORDPRESS;
        fastcgi_cache_key "$scheme$sr_cache_method$host$sr_request_path";
        fastcgi_cache_methods GET HEAD;
        fastcgi_cache_valid 200 60m;
        fastcgi_cache_valid 404 1m;
        fastcgi_cache_min_uses 1;

        fastcgi_cache_lock on;
        fastcgi_cache_lock_timeout 5s;
        fastcgi_cache_use_stale error timeout updating invalid_header http_500 http_503;
        fastcgi_cache_background_update on;

        fastcgi_cache_bypass
            $sr_skip_method
            $sr_skip_query
            $sr_skip_session
            $sr_skip_authorization
            $sr_skip_script
            $sr_skip_path;

        fastcgi_no_cache
            $sr_skip_method
            $sr_skip_query
            $sr_skip_session
            $sr_skip_authorization
            $sr_skip_script
            $sr_skip_path
            $upstream_http_set_cookie;
    }
}
