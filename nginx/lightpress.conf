# ==============================================================================
# LightPress / SpeedPress - Configuração de Alta Performance para Nginx
# ==============================================================================
# Instruções:
# 1. Inclua os blocos 'map', 'limit_req_zone' e 'fastcgi_cache_path' no contexto 'http {}' (nginx.conf).
# 2. Copie o bloco 'server {}' para '/etc/nginx/sites-available/lightpress.conf'
# 3. Crie o symlink em '/etc/nginx/sites-enabled/' e execute 'nginx -t && systemctl reload nginx'
# ==============================================================================

# --- CONTEXTO HTTP (adicione em /etc/nginx/nginx.conf) ---
# Normalização de método: HEAD compartilha o mesmo cache de GET
map $request_method $lp_cache_method {
    default $request_method;
    HEAD GET;
}

# Definição do Cache FastCGI em SSD/NVMe
fastcgi_cache_path /var/cache/nginx/lightpress 
    levels=1:2 
    keys_zone=LIGHTPRESS:100m 
    inactive=10d 
    max_size=10g;

# Normalização da chave de cache FastCGI:
# Utiliza $uri canônica (sem query string) para que variações com parâmetros de rastreamento
# (como ?utm_source=..., ?fbclid=..., etc.) compartilhem a mesma entrada de cache e sejam invalidadas
# simultaneamente pela purga de URL do LightPress.
# Buscas dinâmicas (?q= ou ?s=) continuam ignorando o cache via $lp_skip_cache.
fastcgi_cache_key "$scheme$lp_cache_method$host$uri";

# Rate Limiting defensivo para o contador de visualizações (60 req/min por IP com burst 10)
limit_req_zone $binary_remote_addr zone=lp_views:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=lp_login:5m rate=10r/m;

# Mapeamento para Skip Cache (Apenas rotas dinâmicas essenciais)
map $request_uri $lp_skip_cache_uri {
    default 0;
    ~*/admin/ 1;
    ~*/api/ 1;
}

map $http_cookie $lp_skip_cache_cookie {
    default 0;
    ~*LIGHTPRESSSESSID 1;
}

# --- BLOCO VIRTUAL HOST (SERVER) ---
server {
    listen 80;
    listen [::]:80;
    server_name seudominio.com.br www.seudominio.com.br;

    # Forçar HTTPS permanente
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name seudominio.com.br;

    # Certificados SSL (Ex: Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/seudominio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seudominio.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Raiz Pública do LightPress (aponta exclusivamente para /public)
    root /var/www/lightpress/public;
    index index.php index.html;

    # Logs
    access_log /var/log/nginx/lightpress_access.log;
    error_log /var/log/nginx/lightpress_error.log warn;

    # Tamanho máximo de upload de fotos (8 MiB)
    client_max_body_size 8M;

    # Cabeçalhos HTTP de Segurança Defensivos (Security by Design)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'self';" always;
    add_header X-FastCGI-Cache $upstream_cache_status always;

    # Determinar se a requisição deve pular o cache
    set $lp_skip_cache 0;
    if ($request_method !~ ^(GET|HEAD)$) {
        set $lp_skip_cache 1;
    }
    # Apenas buscas dinâmicas em tempo real pulam cache em rotas públicas (previne Cache-Bypass DoS)
    if ($query_string ~* "(^|&)(q|s)=") {
        set $lp_skip_cache 1;
    }
    if ($lp_skip_cache_uri = 1) {
        set $lp_skip_cache 1;
    }
    if ($lp_skip_cache_cookie = 1) {
        set $lp_skip_cache 1;
    }

    # 1. Blindagem Total do Diretório de Uploads
    # Impede expressamente a execução de qualquer script no diretório de fotos
    location ^~ /uploads/ {
        location ~ \.(php|phtml|phar|pl|py|cgi|sh)$ {
            deny all;
            return 404;
        }
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, no-transform, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    # 2. Assets estáticos (CSS, JS, Favicons)
    location ^~ /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    # 3. Endpoint de Visualizações (/api/view/{id}) com Rate Limiting
    # Bloqueio de acesso direto ao script PHP do contador (forçar uso estrito da rota com limit_req)
    location = /api/view.php {
        deny all;
        return 404;
    }

    location ^~ /api/view/ {
        limit_req zone=lp_views burst=10 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # 4. Painel de Login com Rate Limiting contra Força Bruta
    location = /admin/login.php {
        limit_req zone=lp_login burst=5 nodelay;
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # 5. Roteamento Geral (Front Controller)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 6. Processamento PHP com FastCGI Cache Ativo
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Parâmetros de Cache FastCGI
        fastcgi_cache LIGHTPRESS;
        fastcgi_cache_methods GET HEAD;
        fastcgi_cache_bypass $lp_skip_cache;
        fastcgi_no_cache $lp_skip_cache $upstream_http_set_cookie;

        # TTLs por código de resposta
        fastcgi_cache_valid 200 60m;
        fastcgi_cache_valid 301 302 10m;
        fastcgi_cache_valid 404 1m;

        # Mitigação de Stampede / Concorrência
        fastcgi_cache_lock on;
        fastcgi_cache_lock_timeout 5s;
        fastcgi_cache_use_stale error timeout updating invalid_header http_500 http_503;
        fastcgi_cache_background_update on;

        # Respeitar cabeçalhos nativos do backend
        fastcgi_ignore_headers Set-Cookie; # Seletivo: avaliado pelo no_cache
    }

    # Bloquear arquivos ocultos (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
