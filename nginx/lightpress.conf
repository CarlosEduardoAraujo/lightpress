# ==============================================================================
# LightPress / SpeedPress - Configuração de Alta Performance para Nginx
# ==============================================================================
# Instruções:
# 1. Inclua os blocos 'map', 'limit_req_zone', 'fastcgi_cache_path' e 'upstream' no contexto 'http {}' (nginx.conf).
# 2. Copie o bloco 'server {}' para '/etc/nginx/sites-available/lightpress.conf'
# 3. Crie o symlink em '/etc/nginx/sites-enabled/' e execute 'nginx -t && systemctl reload nginx'
# ==============================================================================

# --- CONTEXTO HTTP (adicione em /etc/nginx/nginx.conf) ---
# HEAD utiliza a mesma entrada de cache de GET.
map $request_method $lp_cache_method {
    default $request_method;
    HEAD GET;
}

# Usa a URI ORIGINAL, sem query string, mesmo após o redirecionamento interno para index.php.
map $request_uri $lp_request_path {
    ~^(?<lp_original_path>[^?]+) $lp_original_path;
    default $request_uri;
}

map $request_method $lp_skip_method {
    default 1;
    GET 0;
    HEAD 0;
}

# Toda query funcional/desconhecida ignora cache; apenas rastreamento é dispensável.
map $args $lp_skip_query {
    default 1;
    "" 0;
    ~*^((utm_[a-z0-9_]+|fbclid|gclid|msclkid)=[^&]*&?)+$ 0;
}

map $http_cookie $lp_skip_cache_cookie {
    default 0;
    ~*LIGHTPRESSSESSID 1;
}

map $http_authorization $lp_skip_authorization {
    default 1;
    "" 0;
}

# Somente o front controller público pode utilizar cache de respostas PHP.
# Isso também protege arquivos administrativos acessados por caminhos codificados.
map $fastcgi_script_name $lp_skip_script {
    default 1;
    /index.php 0;
}

map $lp_request_path $lp_skip_path {
    default 0;
    ~*^/(admin|api|preview)(/|$) 1;
    # Caminhos alternativos não devem criar cópias fora da purga canônica.
    ~% 1;
    ~// 1;
}

# Definição do Cache FastCGI em SSD/NVMe
fastcgi_cache_path /var/cache/nginx/lightpress
    levels=1:2
    keys_zone=LIGHTPRESS:100m
    inactive=10d
    max_size=10g;

fastcgi_cache_key "$scheme$lp_cache_method$host$lp_request_path";

# Rate Limiting defensivo para rotas sensíveis
limit_req_zone $binary_remote_addr zone=lp_views:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=lp_login:5m rate=10r/m;
limit_req_zone $binary_remote_addr zone=lp_api:10m rate=60r/m;

# Backend PHP-FPM com rollback instantâneo entre PHP 8.5 e PHP 8.4
upstream lightpress_php {
    server unix:/run/php/php8.5-fpm.sock;
    # server unix:/run/php/php8.4-fpm.sock;
}

# --- BLOCO VIRTUAL HOST (SERVER) ---
server {
    listen 80;
    listen [::]:80;
    server_name seudominio.com.br www.seudominio.com.br;

    # Forçar HTTPS permanente
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name seudominio.com.br;

    # Certificados SSL (Ex: Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/seudominio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seudominio.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Raiz Pública do LightPress (aponta exclusivamente para /public)
    root /var/www/lightpress/public;
    index index.php index.html index.htm;
    server_tokens off;

    # Evita que redirects internos de diretório gerem Location absoluto incorreto atrás de proxy/tunnel.
    absolute_redirect off;

    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Alinhado ao limite de upload de 8 MiB + overhead multipart.
    client_max_body_size 12M;

    # Logs e limite
    access_log off;
    error_log /var/log/nginx/lightpress_error.log warn;
    limit_req_status 429;

    # Oculta a cópia vinda do PHP-FPM para que o add_header do Nginx emita cada cabeçalho apenas 1 vez
    fastcgi_hide_header X-Content-Type-Options;
    fastcgi_hide_header X-Frame-Options;
    fastcgi_hide_header Referrer-Policy;
    fastcgi_hide_header Permissions-Policy;

    # Cabeçalhos HTTP de Segurança Defensivos (Security by Design)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Served-By "Ultra LightPress" always;
    add_header X-FastCGI-Cache $upstream_cache_status always;

    # A CSP pública permanece sob controle do LightPress (public/index.php).
    # O painel /admin/ recebe CSP própria em seu bloco location dedicado abaixo.

    # Bloquear arquivos ocultos (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 1. Uploads novos: somente arquivos estáticos; nunca executar interpretadores ou scripts em SVG.
    location ^~ /uploads/ {
        location ~ /\. {
            return 404;
        }
        location ~* \.(php[0-9]*|phtml|phar|pl|py|cgi|sh)(/|$) {
            return 404;
        }

        try_files $uri =404;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox;" always;
        add_header X-Served-By "Ultra LightPress" always;
    }

    # 2. Favicon e Robots na Raiz
    location = /favicon.ico {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Served-By "Ultra LightPress" always;
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        try_files $uri =404;
        log_not_found off;
        access_log off;
    }

    # 3. Endpoint de Visualizações (/api/view/{id}) com Rate Limiting
    location = /api/view.php {
        return 404;
    }

    location ^~ /api/view/ {
        limit_req zone=lp_views burst=10 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # APIs públicas com Rate Limiting defensivo
    location ^~ /api/ {
        limit_req zone=lp_api burst=20 nodelay;

        try_files $uri =404;

        location ~ \.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTP_X_REAL_IP $remote_addr;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_pass lightpress_php;
            fastcgi_intercept_errors off;
        }
    }

    # Atalho direto para /admin (sem barra final) evitando redirect de diretório.
    location = /admin {
        return 302 /admin/login.php;
    }

    # 4. Login separado: sempre dinâmico, sem cache e com limite por IP real do visitante.
    location = /admin/login.php {
        limit_req zone=lp_login burst=5 nodelay;
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass lightpress_php;
        fastcgi_cache off;
        fastcgi_intercept_errors off;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Served-By "Ultra LightPress" always;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com; frame-ancestors 'self';" always;
    }

    # Ativação de conta separada: protegida contra força bruta e sem cache.
    location = /admin/activate.php {
        limit_req zone=lp_login burst=5 nodelay;
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass lightpress_php;
        fastcgi_cache off;
        fastcgi_intercept_errors off;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Served-By "Ultra LightPress" always;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com; frame-ancestors 'self';" always;
    }

    # 4b. Painel administrativo: executa PHP via location aninhado e aplica CSP dedicada ao /admin/.
    location ^~ /admin/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Served-By "Ultra LightPress" always;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com; frame-ancestors 'self';" always;

        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            try_files $uri =404;

            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTP_X_REAL_IP $remote_addr;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_pass lightpress_php;
            fastcgi_cache off;
            fastcgi_intercept_errors off;
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 16k;

            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Served-By "Ultra LightPress" always;
            add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com; frame-ancestors 'self';" always;
        }
    }

    # Assets estáticos (CSS, JS, Imagens, Fontes)
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|webp|avif|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Served-By "Ultra LightPress" always;
    }

    # 5. Roteamento Geral (Front Controller)
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # 6. Processamento PHP com FastCGI Cache Ativo
    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass lightpress_php;
        fastcgi_intercept_errors off;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;

        # Parâmetros de Cache FastCGI
        fastcgi_cache LIGHTPRESS;
        fastcgi_cache_key "$scheme$lp_cache_method$host$lp_request_path";
        fastcgi_cache_methods GET HEAD;
        fastcgi_cache_valid 200 60m;
        fastcgi_cache_valid 404 1m;
        fastcgi_cache_min_uses 1;

        # Mitigação de Stampede / Concorrência
        fastcgi_cache_lock on;
        fastcgi_cache_lock_timeout 5s;
        fastcgi_cache_use_stale error timeout updating invalid_header http_500 http_503;
        fastcgi_cache_background_update on;

        fastcgi_cache_bypass
            $lp_skip_method
            $lp_skip_query
            $lp_skip_cache_cookie
            $lp_skip_authorization
            $lp_skip_script
            $lp_skip_path;

        fastcgi_no_cache
            $lp_skip_method
            $lp_skip_query
            $lp_skip_cache_cookie
            $lp_skip_authorization
            $lp_skip_script
            $lp_skip_path
            $upstream_http_set_cookie;
    }
}
